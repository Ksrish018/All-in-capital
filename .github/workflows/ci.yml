name: CI

# PRD Section 19.7. Quick checks on every push and pull request.
# The database check needs repository secrets and skips itself until they are added.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx next typegen && npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (no model calls, no keys)
        run: npm test
      - name: Build
        run: npm run build

  database:
    name: Database check (live)
    runs-on: ubuntu-latest
    needs: quick
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when secrets are not set yet
        id: gate
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Repository secrets are not set. Skipping the live database check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Row Level Security, queues, bucket and anonymous access
        if: steps.gate.outputs.run == 'true'
        run: node scripts/verify-db.mjs --strict
